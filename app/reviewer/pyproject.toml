[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewer"
version = "0.1.0"
description = "PR peer-review agent on AgentCore Runtime (Strands + Bedrock)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.24.2",
    "botocore[crt] >= 1.35.0",
    "httpx >= 0.28",
    "pydantic >= 2.0",
    "strands-agents >= 1.61.1",
]

[dependency-groups]
dev = ["pytest >= 8"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
